<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | PREÇO JUSTO</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="dark-mode">

  <!-- Header Navbar -->
  <header class="header">
    <div class="header-logo">
      <a href="index.html" class="logo-brand">
        <img src="./logo.png" alt="Preço Justo Logo" class="nav-logo-img-large">
      </a>
    </div>
  </header>

  <main class="login-wrapper">
    <div class="login-card">
      <h2>Acesse sua conta</h2>
      
      <form onsubmit="realizarLogin(event)">
        <div class="login-input-group">
          <label>E-mail ou Nome de Usuário</label>
          <input type="text" id="loginUsuario" placeholder="ex: admin ou seu@email.com" required>
        </div>

        <div class="login-input-group">
          <label>Senha</label>
          <input type="password" id="loginSenha" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login-submit">Entrar</button>
      </form>

      <div class="login-links-grid">
        <a href="#" onclick="alert('Funcionalidade de Primeiro Acesso em breve!')">Primeiro Acesso</a>
        <a href="#" onclick="alert('Instruções de recuperação enviadas para o e-mail.')">Esqueci a senha</a>
      </div>

      <hr class="modal-divider" style="border: none; border-top: 1px solid #1F2937; margin: 1.2rem 0;">

      <div class="empresa-box-action">
        <p style="font-size: 0.8rem; color: #9CA3AF; margin-bottom: 8px; text-align: center;">Representa um estabelecimento?</p>
        <button type="button" class="btn-empresa-register" onclick="window.location.href='empresa-cadastro.html'">Registrar Empresa / Parceiro</button>
      </div>

      <a href="index.html" class="back-home">← Voltar para o início</a>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-container text-center" style="text-align: center;">
      <p>PREÇO JUSTO © 2026 • Todos os direitos reservados.</p>
    </div>
  </footer>

  <script>
    function realizarLogin(event) {
      event.preventDefault();
      const usuario = document.getElementById('loginUsuario').value.trim();
      const senha = document.getElementById('loginSenha').value.trim();

      if (usuario === 'admin' && senha === 'admin') {
        alert('Login de Administrador efetuado com sucesso!');
        window.location.href = 'index.html?admin=true';
      } else {
        alert('Login efetuado com sucesso!');
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
