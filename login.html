<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | PREÇO JUSTO</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .login-page-wrapper {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      background: radial-gradient(circle at 50% 20%, #162B28 0%, #0B1315 75%);
    }

    .login-card-elegant {
      background-color: #111C1E;
      border: 1px solid #1F2937;
      border-radius: 20px;
      padding: 2.2rem 2.5rem;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .login-header-brand {
      text-align: center;
      margin-bottom: 1.2rem;
    }

    .login-header-brand img {
      max-width: 190px;
      width: 100%;
      height: auto;
      object-fit: contain;
      margin-bottom: 0.5rem;
    }

    .login-header-brand p {
      font-size: 0.85rem;
      color: #9CA3AF;
      margin-top: 0.1rem;
    }

    .social-login-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }

    .btn-social {
      background-color: #0E1719;
      border: 1px solid #374151;
      color: #FFFFFF;
      padding: 0.65rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .btn-social:hover {
      background-color: #1A292C;
      border-color: #22C55E;
    }

    .social-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .divider-or {
      display: flex;
      align-items: center;
      text-align: center;
      color: #6B7280;
      font-size: 0.72rem;
      text-transform: uppercase;
      margin: 1rem 0;
      font-weight: 700;
    }

    .divider-or::before, .divider-or::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #1F2937;
    }

    .divider-or::before { margin-right: .75em; }
    .divider-or::after { margin-left: .75em; }

    .login-form-group {
      margin-bottom: 0.9rem;
      display: flex;
      flex-direction: column;
    }

    .login-form-group label {
      font-size: 0.73rem;
      font-weight: 700;
      color: #9CA3AF;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .login-form-group input {
      background-color: #0E1719;
      border: 1px solid #374151;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      color: #FFFFFF;
      font-size: 0.92rem;
      outline: none;
    }

    .login-form-group input:focus {
      border-color: #22C55E;
    }

    .btn-login-action {
      width: 100%;
      background-color: #22C55E;
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 0.4rem;
    }

    .btn-login-action:hover {
      background-color: #16A34A;
    }

    .login-links-row {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
      font-size: 0.8rem;
    }

    .login-links-row a {
      color: #9CA3AF;
      text-decoration: none;
      font-weight: 600;
    }

    .login-links-row a:hover {
      color: #22C55E;
    }

    .divider-line {
      border: none;
      border-top: 1px solid #1F2937;
      margin: 1.1rem 0;
    }

    .empresa-action-box {
      background-color: #0E1719;
      border: 1px solid #1F2937;
      padding: 0.9rem;
      border-radius: 12px;
      text-align: center;
    }

    .empresa-action-box p {
      font-size: 0.78rem;
      color: #9CA3AF;
      margin-bottom: 0.4rem;
    }

    .btn-empresa-link {
      display: inline-block;
      width: 100%;
      background-color: transparent;
      border: 1px solid #22C55E;
      color: #22C55E;
      padding: 0.6rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      text-decoration: none;
    }

    .btn-empresa-link:hover {
      background-color: #22C55E;
      color: #FFFFFF;
    }

    .back-home-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #9CA3AF;
      text-decoration: none;
      font-size: 0.82rem;
    }

    .back-home-link:hover {
      color: #22C55E;
    }
  </style>
</head>
<body class="dark-mode">

  <main class="login-page-wrapper">
    <div class="login-card-elegant">
      
      <div class="login-header-brand">
        <a href="index.html">
          <img src="./logo.png" alt="Preço Justo Logo">
        </a>
        <p>Faça login para gerenciar suas viagens</p>
      </div>

      <div class="social-login-grid">
        <button type="button" class="btn-social" onclick="alert('Login com Google em desenvolvimento')">
          <svg class="social-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Google
        </button>
        <button type="button" class="btn-social" onclick="alert('Login com Apple em desenvolvimento')">
          <svg class="social-icon" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.89 5.55c.62-.75 1.04-1.79.93-2.83-.92.04-2.03.62-2.69 1.37-.58.65-1.09 1.7-1.01 2.73 1.03.08 2.08-.55 2.77-1.27z"/></svg>
          Apple
        </button>
      </div>

      <div class="divider-or">ou continue com e-mail</div>

      <form onsubmit="realizarLogin(event)">
        <div class="login-form-group">
          <label>Seu nome ou @email.com</label>
          <input type="text" id="loginUsuario" placeholder="Seu nome ou @email.com" required>
        </div>

        <div class="login-form-group">
          <label>Senha</label>
          <input type="password" id="loginSenha" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login-action">Entrar</button>
      </form>

      <div class="login-links-row">
        <a href="#" onclick="alert('Funcionalidade de Primeiro Acesso em breve!')">Primeiro Acesso</a>
        <a href="#" onclick="alert('Instruções de recuperação enviadas para o e-mail.')">Esqueci a senha</a>
      </div>

      <hr class="divider-line">

      <div class="empresa-action-box">
        <p>Representa um estabelecimento ou negócio?</p>
        <a href="empresa-cadastro.html" class="btn-empresa-link">Registrar Empresa / Parceiro</a>
      </div>

      <a href="index.html" class="back-home-link">← Voltar para o início</a>

    </div>
  </main>

  <script>
    function realizarLogin(event) {
      event.preventDefault();
      const usuario = document.getElementById('loginUsuario').value.trim();
      const senha = document.getElementById('loginSenha').value.trim();

      if (usuario.toLowerCase() === 'admin' && senha === 'admin') {
        window.location.href = 'index.html?admin=true';
      } else {
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
