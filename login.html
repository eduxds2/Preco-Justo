<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | PREÇO JUSTO</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .login-page-wrapper {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 50% 20%, #162B28 0%, #0B1315 75%);
    }

    .login-card-elegant {
      background-color: #111C1E;
      border: 1px solid #1F2937;
      border-radius: 20px;
      padding: 2.8rem 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .login-header-brand {
      text-align: center;
      margin-bottom: 1.8rem;
    }

    /* Logo maior conforme pedido */
    .login-header-brand img {
      max-width: 220px;
      width: 100%;
      height: auto;
      object-fit: contain;
      margin-bottom: 0.8rem;
    }

    .login-header-brand p {
      font-size: 0.88rem;
      color: #9CA3AF;
      margin-top: 0.2rem;
    }

    /* Botões Sociais (Google, Apple, etc.) */
    .social-login-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }

    .btn-social {
      background-color: #0E1719;
      border: 1px solid #374151;
      color: #FFFFFF;
      padding: 0.75rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, border-color 0.2s;
      text-decoration: none;
    }

    .btn-social:hover {
      background-color: #1A292C;
      border-color: #22C55E;
    }

    .divider-or {
      display: flex;
      align-items: center;
      text-align: center;
      color: #6B7280;
      font-size: 0.75rem;
      text-transform: uppercase;
      margin: 1.2rem 0;
      font-weight: 700;
    }

    .divider-or::before, .divider-or::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #1F2937;
    }

    .divider-or::before { margin-right: .75em; }
    .divider-or::after { margin-left: .75em; }

    .login-form-group {
      margin-bottom: 1.2rem;
      display: flex;
      flex-direction: column;
    }

    .login-form-group label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #9CA3AF;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .login-form-group input {
      background-color: #0E1719;
      border: 1px solid #374151;
      padding: 0.9rem 1rem;
      border-radius: 10px;
      color: #FFFFFF;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-form-group input:focus {
      border-color: #22C55E;
    }

    .btn-login-action {
      width: 100%;
      background-color: #22C55E;
      color: white;
      border: none;
      padding: 0.95rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background-color 0.2s;
    }

    .btn-login-action:hover {
      background-color: #16A34A;
    }

    .login-links-row {
      display: flex;
      justify-content: space-between;
      margin-top: 1.2rem;
      font-size: 0.82rem;
    }

    .login-links-row a {
      color: #9CA3AF;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .login-links-row a:hover {
      color: #22C55E;
    }

    .divider-line {
      border: none;
      border-top: 1px solid #1F2937;
      margin: 1.5rem 0;
    }

    .empresa-action-box {
      background-color: #0E1719;
      border: 1px solid #1F2937;
      padding: 1.1rem;
      border-radius: 12px;
      text-align: center;
    }

    .empresa-action-box p {
      font-size: 0.8rem;
      color: #9CA3AF;
      margin-bottom: 0.6rem;
    }

    .btn-empresa-link {
      display: inline-block;
      width: 100%;
      background-color: transparent;
      border: 1px solid #22C55E;
      color: #22C55E;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-empresa-link:hover {
      background-color: #22C55E;
      color: #FFFFFF;
    }

    .back-home-link {
      display: block;
      text-align: center;
      margin-top: 1.4rem;
      color: #9CA3AF;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .back-home-link:hover {
      color: #22C55E;
    }
  </style>
</head>
<body class="dark-mode">

  <main class="login-page-wrapper">
    <div class="login-card-elegant">
      
      <div class="login-header-brand">
        <a href="index.html">
          <img src="./logo.png" alt="Preço Justo Logo">
        </a>
        <p>Faça login para gerenciar suas viagens</p>
      </div>

      <!-- Login Social -->
      <div class="social-login-grid">
        <button type="button" class="btn-social" onclick="alert('Login com Google em desenvolvimento')">
          🌐 Google
        </button>
        <button type="button" class="btn-social" onclick="alert('Login com Apple em desenvolvimento')">
           Apple
        </button>
      </div>

      <div class="divider-or">ou continue com e-mail</div>

      <form onsubmit="realizarLogin(event)">
        <div class="login-form-group">
          <label>Seu nome ou @email.com</label>
          <input type="text" id="loginUsuario" placeholder="Seu nome ou @email.com" required>
        </div>

        <div class="login-form-group">
          <label>Senha</label>
          <input type="password" id="loginSenha" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login-action">Entrar</button>
      </form>

      <div class="login-links-row">
        <a href="#" onclick="alert('Funcionalidade de Primeiro Acesso em breve!')">Primeiro Acesso</a>
        <a href="#" onclick="alert('Instruções de recuperação enviadas para o e-mail.')">Esqueci a senha</a>
      </div>

      <hr class="divider-line">

      <div class="empresa-action-box">
        <p>Representa um estabelecimento ou negócio?</p>
        <a href="empresa-cadastro.html" class="btn-empresa-link">Registrar Empresa / Parceiro</a>
      </div>

      <a href="index.html" class="back-home-link">← Voltar para o início</a>

    </div>
  </main>

  <script>
    function realizarLogin(event) {
      event.preventDefault();
      const usuario = document.getElementById('loginUsuario').value.trim();
      const senha = document.getElementById('loginSenha').value.trim();

      if (usuario.toLowerCase() === 'admin' && senha === 'admin') {
        alert('Login de Administrador efetuado com sucesso!');
        window.location.href = 'index.html?admin=true';
      } else {
        alert('Login efetuado com sucesso!');
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
