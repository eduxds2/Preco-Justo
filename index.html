<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PREÇO JUSTO | Compare e Economize</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho Limpo -->
  <header>
    <div class="logo-container">
      <span class="logo-text">PREÇO JUSTO</span>
    </div>
  </header>

  <!-- Busca Principal -->
  <section class="hero">
    <h1>Encontre o menor preço sem complicação</h1>
    <p>Compare valores de acomodações e produtos diretamente nos parceiros.</p>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="O que você está procurando hoje?">
      <button onclick="buscarOfertas()">Buscar</button>
    </div>
  </section>

  <!-- Container onde o JavaScript injeta os cards -->
  <main class="container" id="offersContainer"></main>

  <script src="script.js"></script>
</body>
</html>
