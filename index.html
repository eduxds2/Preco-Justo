<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preçojusto.com | Site Oficial | Tarifas justas e mais economia</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./logo.png">
  <link rel="shortcut icon" type="image/png" href="./logo.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="dark-mode">

  <!-- CABEÇALHO PRINCIPAL -->
  <div class="header-booking-wrapper">

    <header class="header">
      <div class="header-logo">
        <a href="index.html" class="logo-brand-img-link">
          <img src="./logo-texto.png"
               alt="Preçojusto.com"
               class="nav-text-logo-img">
        </a>
      </div>

      <div class="header-nav-actions booking-header-right">
        <span class="currency-display">BRL</span>

        <img src="https://flagcdn.com/w40/br.png"
             alt="Brasil"
             class="flag-icon-small">

        <div id="authActionContainer">
          <a href="login.html" class="header-btn btn-login">
            Fazer login
          </a>
        </div>
      </div>
    </header>

    <!-- NAVEGAÇÃO PRINCIPAL -->
    <nav class="header-nav-tabs">
      <button class="tab-btn active"
        onclick="trocarAba('monte', this)">
        Monte sua viagem
      </button>

      <button class="tab-btn"
        onclick="trocarAba('voos', this)">
        Voos
      </button>

      <button class="tab-btn"
        onclick="trocarAba('pacotes', this)">
        Pacotes
      </button>

      <button class="tab-btn"
        onclick="trocarAba('hospedagem', this)">
        Hospedagem
      </button>

      <button class="tab-btn"
        onclick="trocarAba('carros', this)">
        Carros
      </button>

      <button class="tab-btn"
        onclick="trocarAba('seguros', this)">
        Seguros
      </button>
    </nav>

  </div>

  <!-- Hero Banner e Card de Pesquisa -->
  <section class="hero-section">
    <div class="search-container">
      
      <div class="hero-brand-header text-center" style="margin-bottom: 2rem;">
        <h1 style="font-size: 2.3rem; font-weight: 800; color: #F8FAFC; margin-bottom: 0.5rem;">Encontre sua próxima viagem</h1>
        <p class="hero-subtitle" style="font-size: 1.05rem; color: #9CA3AF;">Compare voos, hotéis, carros e seguros com total transparência e economia.</p>
      </div>

      <div class="search-card">
        
        <!-- FORMULÁRIO GERAL -->
        <div id="formGeral">
          <div class="search-card-header">
            <h2 id="searchCardTitle">Pesquisar viagens</h2>
            <div class="trip-options" id="tripOptions">
              <label class="radio-pill active" id="pillIdaVolta" onclick="selecionarTipoViagem('ida-volta')">
                <input type="radio" name="tripType" value="ida-volta" checked> ✓ Ida e volta
              </label>
              <label class="radio-pill" id="pillSomenteIda" onclick="selecionarTipoViagem('somente-ida')">
                <input type="radio" name="tripType" value="somente-ida"> Somente ida
              </label>
            </div>
          </div>

          <div class="search-inputs-grid">
            <div class="input-box flex-2">
              <span class="box-label" id="labelOrigem">DE</span>
              <input type="text" id="inputOrigem" placeholder="Insira uma origem">
            </div>
            
            <button class="btn-swap" id="btnSwap" onclick="inverterDestinos()" title="Inverter">⇆</button>
            
            <div class="input-box flex-2">
              <span class="box-label" id="labelDestino">PARA</span>
              <input type="text" id="inputDestino" placeholder="Insira um destino">
            </div>
            
            <button class="btn-submit-search" onclick="realizarPesquisa()">BUSCAR</button>
          </div>
        </div>

        <!-- FORMULÁRIO DE HOSPEDAGEM -->
        <div id="formHospedagem" style="display:none;">
          <div class="search-card-header">
            <h2>Encontre sua próxima estadia</h2>
          </div>

          <div class="search-inputs-grid">
            <div class="input-box flex-2">
              <span class="box-label">DESTINO</span>
              <input type="text" id="stayDestino" placeholder="Para onde você vai?">
            </div>

            <div class="input-box">
              <span class="box-label">ENTRADA (CHECK-IN)</span>
              <input type="date" id="stayDataEntrada" class="date-input-clean">
            </div>

            <div class="input-box">
              <span class="box-label">SAÍDA (CHECK-OUT)</span>
              <input type="date" id="stayDataSaida" class="date-input-clean">
            </div>

            <div class="input-box flex-2 relative-box">
              <span class="box-label">HÓSPEDES E QUARTOS</span>
              <input type="text" id="stayOcupacaoInput" value="2 hóspedes, 1 quarto" readonly onclick="toggleModalHospedes()">
              
              <div class="guest-modal" id="guestModal" style="display:none;">
                <div class="modal-row">
                  <div class="modal-label"><strong>Adultos</strong></div>
                  <div class="counter-control">
                    <button type="button" class="btn-counter" onclick="alterarHospedes('adultos', -1)">-</button>
                    <span id="cntAdultos" class="counter-value">2</span>
                    <button type="button" class="btn-counter" onclick="alterarHospedes('adultos', 1)">+</button>
                  </div>
                </div>

                <div class="modal-row">
                  <div class="modal-label"><strong>Crianças</strong></div>
                  <div class="counter-control">
                    <button type="button" class="btn-counter" onclick="alterarHospedes('criancas', -1)">-</button>
                    <span id="cntCriancas" class="counter-value">0</span>
                    <button type="button" class="btn-counter" onclick="alterarHospedes('criancas', 1)">+</button>
                  </div>
                </div>

                <div class="modal-row">
                  <div class="modal-label"><strong>Quartos</strong></div>
                  <div class="counter-control">
                    <button type="button" class="btn-counter" onclick="alterarHospedes('quartos', -1)">-</button>
                    <span id="cntQuartos" class="counter-value">1</span>
                    <button type="button" class="btn-counter" onclick="alterarHospedes('quartos', 1)">+</button>
                  </div>
                </div>

                <hr class="modal-divider">

                <div class="modal-checkbox-row">
                  <label><input type="checkbox" id="chkPets"> Aceita animais</label>
                </div>

                <div class="modal-footer-btns">
                  <button type="button" class="btn-redefinir" onclick="redefinirHospedes()">REDEFINIR</button>
                  <button type="button" class="btn-confirmar" onclick="confirmarHospedes()">Confirmar</button>
                </div>
              </div>
            </div>

            <button class="btn-submit-search" onclick="realizarPesquisa()">BUSCAR</button>
          </div>
        </div>

      </div>

    </div>
  </section>

  <!-- Restante do corpo, blocos de conteúdo e rodapé mantêm-se iguais -->
