<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preço Justo - Encontre o melhor preço</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b1110;
            color: #e2e8f0;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

    <!-- Cabeçalho (Navbar Superior) -->
    <header class="w-full py-5 px-8 flex justify-between items-center border-b border-emerald-950">
        <div class="flex items-center space-x-3">
            <!-- Sua Logo em PNG -->
            <img src="logo.png" alt="Preço Justo" class="h-10 w-auto object-contain" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
            <span id="fallback-logo" style="display:none;" class="text-xl font-black tracking-widest text-emerald-400 uppercase">Preço Justo</span>
        </div>
        
        <!-- Menu Central e Links Direitos -->
        <div class="hidden md:flex items-center space-x-8 text-sm font-medium text-emerald-300/80">
            <a href="#" class="hover:text-emerald-400 transition">Descubra</a>
            <a href="#" class="hover:text-emerald-400 transition">Minhas viagens</a>
            <a href="#" class="hover:text-emerald-400 transition">Central de Ajuda</a>
        </div>

        <div class="flex items-center space-x-4">
            <a href="login.html" class="bg-emerald-500 hover:bg-emerald-400 text-black px-5 py-2 rounded-full font-bold text-sm transition shadow-lg shadow-emerald-500/20">
                Entrar / Cadastrar
            </a>
        </div>
    </header>

    <!-- Conteúdo Principal com Hero e Barra de Abas -->
    <main class="flex-grow flex flex-col items-center px-4 pt-8 pb-16">
        
        <!-- Bloco de Destaque / Slogan -->
        <div class="max-w-5xl w-full mb-6 text-left flex flex-col sm:flex-row justify-between items-center">
            <div class="space-y-2">
                <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-emerald-400">
                    preço justo
                </h1>
                <p class="text-sm sm:text-base text-emerald-600 font-medium">
                    Voe com tarifas justas e mais economia para chegar onde importa.
                </p>
            </div>
            <!-- Elemento decorativo visual -->
            <div class="hidden lg:block text-emerald-500/40 text-xs uppercase tracking-widest border border-emerald-900/60 px-4 py-2 rounded-xl">
                ✈️ Comparador Inteligente
            </div>
        </div>

        <!-- Container do Motor de Busca (Estilo Referência) -->
        <div class="max-w-5xl w-full">
            
            <!-- Abas de Navegação do Serviço (Voos, Pacotes, Hospedagem, etc) -->
            <div class="flex overflow-x-auto space-x-1 bg-[#121c19] p-1.5 rounded-t-2xl border-t border-x border-emerald-900/40">
                <button class="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-emerald-500 text-black shadow-md transition whitespace-nowrap">Voos</button>
                <button class="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-medium text-emerald-400/70 hover:bg-emerald-950/40 hover:text-emerald-300 transition whitespace-nowrap">Pacotes</button>
                <button class="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-medium text-emerald-400/70 hover:bg-emerald-950/40 hover:text-emerald-300 transition whitespace-nowrap">Hospedagem</button>
                <button class="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-medium text-emerald-400/70 hover:bg-emerald-950/40 hover:text-emerald-300 transition whitespace-nowrap">Carros</button>
                <button class="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-medium text-emerald-400/70 hover:bg-emerald-950/40 hover:text-emerald-300 transition whitespace-nowrap">Seguros</button>
                <button class="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-medium text-emerald-400/70 hover:bg-emerald-950/40 hover:text-emerald-300 transition whitespace-nowrap">eSIM</button>
            </div>

            <!-- Caixa de Pesquisa Principal -->
            <div class="bg-[#121c19] border border-emerald-900/40 p-6 rounded-b-2xl rounded-tr-2xl shadow-2xl space-y-6">
                
                <!-- Tipo de Viagem (Ida e volta, Somente ida, etc) -->
                <div class="flex flex-wrap items-center gap-3">
                    <button class="bg-emerald-950/60 border border-emerald-800/60 text-emerald-300 text-xs font-semibold px-4 py-2 rounded-full flex items-center space-x-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                        <span>Ida e volta</span>
                    </button>
                    <button class="text-emerald-600 hover:text-emerald-400 text-xs font-medium px-4 py-2 rounded-full transition">Somente ida</button>
                    <button class="text-emerald-600 hover:text-emerald-400 text-xs font-medium px-4 py-2 rounded-full transition">Multidestino</button>
                </div>

                <!-- Campos de Origem e Destino -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-[#0b1110] p-3 rounded-2xl border border-emerald-900/50 relative">
                    <div class="p-3">
                        <label class="block text-[10px] font-bold text-emerald-600 uppercase tracking-wider mb-1">De</label>
                        <input type="text" placeholder="Insira uma origem" class="w-full bg-transparent text-emerald-200 focus:outline-none placeholder-emerald-800/70 text-sm font-medium">
                    </div>
                    <div class="p-3 border-t md:border-t-0 md:border-l border-emerald-900/50">
                        <label class="block text-[10px] font-bold text-emerald-600 uppercase tracking-wider mb-1">Para</label>
                        <input type="text" placeholder="Insira um destino" class="w-full bg-transparent text-emerald-200 focus:outline-none placeholder-emerald-800/70 text-sm font-medium">
                    </div>
                </div>

                <!-- Botão de Pesquisa -->
                <div class="flex justify-end">
                    <button onclick="window.location.href='login.html'" class="w-full md:w-auto bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-3.5 px-8 rounded-xl transition shadow-lg shadow-emerald-500/20 text-sm tracking-wide cursor-pointer">
                        Pesquisar Voos
                    </button>
                </div>

            </div>

        </div>

    </main>

    <!-- Rodapé -->
    <footer class="w-full py-6 text-center text-xs text-emerald-900 border-t border-emerald-950">
        &copy; 2026 Preço Justo. Todos os direitos reservados. Hospedado no GitHub Pages.
    </footer>

</body>
</html>
