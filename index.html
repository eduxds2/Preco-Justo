<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PREÇO JUSTO | Compare e Economize</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho Limpo -->
  <header>
    <div class="logo-container">
      <span class="logo-text">PREÇO JUSTO</span>
    </div>
  </header>

  <!-- Busca Principal -->
  <section class="hero">
    <h1>Encontre o menor preço sem complicação</h1>
    <p>Compare valores de acomodações e produtos diretamente nos parceiros.</p>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="O que você está procurando hoje?">
      <button onclick="buscarOfertas()">Buscar</button>
    </div>
  </section>

  <!-- Ofertas (Visão do Comprador - Sem Login) -->
  <main class="container" id="offersContainer">
    
    <div class="card">
      <img src="https://via.placeholder.com/120" alt="Item" class="card-img">
      <div class="card-info">
        <span class="card-tag">Acomodação</span>
        <h2 class="card-title">Hotel & Resort Vista Mar</h2>
        <p class="card-location">Santo André, São Paulo • 500m do centro</p>
        <p style="font-size: 0.875rem; color: #EAB308;">★ 4.9 <span style="color: #94A3B8;">(320 avaliações)</span></p>
      </div>
      <div class="card-action">
        <span class="price-label">A partir de</span>
        <span class="price-value">R$ 280,00</span>
        <a href="https://www.booking.com" target="_blank" rel="noopener noreferrer" class="btn-redirect">
          Ver Oferta 🡭
        </a>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
