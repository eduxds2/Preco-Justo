<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - PREÇO JUSTO</title>
    <!-- Tailwind CSS para estilização rápida e limpa -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #ffffff;
            color: #1f2937;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho / Navbar -->
    <header class="w-full py-4 px-6 border-b border-gray-100 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-2">
            <!-- Logo Customizada (Substituindo o padrão do Trivago) -->
            <span class="text-2xl font-black tracking-wider text-blue-600 uppercase">Preço Justo</span>
        </div>
        <div>
            <a href="login.html" class="bg-blue-600 text-white px-5 py-2 rounded-full font-medium hover:bg-blue-700 transition shadow-md">
                Entrar / Cadastrar
            </a>
        </div>
    </header>

    <!-- Bloco Central de Destaque (Inspirado no layout central do Trivago, com fundo branco e foco na logo/busca) -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-3xl w-full text-center space-y-8">
            
            <!-- Logo Gigante / Slogan Central -->
            <div class="space-y-3">
                <div class="inline-block bg-blue-50 text-blue-600 px-4 py-1.5 rounded-full text-sm font-semibold tracking-wide">
                    Comparador Inteligente de Preços
                </div>
                <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-gray-900">
                    Encontre o melhor preço para sua viagem.
                </h1>
                <p class="text-lg text-gray-500 max-w-xl mx-auto">
                    Compare hotéis, carros e pacotes em dezenas de sites em segundos.
                </p>
            </div>

            <!-- Caixa de Pesquisa Interativa -->
            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-xl border border-gray-200 grid grid-cols-1 sm:grid-cols-3 gap-4 text-left">
                <div class="border-b sm:border-b-0 sm:border-r border-gray-200 pb-3 sm:pb-0 sm:pr-4">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Destino ou Hotel</label>
                    <input type="text" placeholder="Para onde você vai?" class="w-full focus:outline-none text-gray-800 font-medium placeholder-gray-400">
                </div>
                <div class="border-b sm:border-b-0 sm:border-r border-gray-200 pb-3 sm:pb-0 sm:pr-4">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Datas</label>
                    <input type="text" placeholder="Check-in — Check-out" class="w-full focus:outline-none text-gray-800 font-medium placeholder-gray-400">
                </div>
                <div class="flex items-center">
                    <button onclick="window.location.href='login.html'" class="w-full bg-blue-600 text-white font-semibold py-3 px-6 rounded-xl hover:bg-blue-700 transition shadow-lg text-center">
                        Pesquisar
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Rodapé Simples -->
    <footer class="w-full py-6 text-center text-xs text-gray-400 border-t border-gray-100">
        &copy; 2026 Preço Justo. Todos os direitos reservados. Hospedado no GitHub Pages.
    </footer>

</body>
</html>
