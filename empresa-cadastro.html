<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Empresa | PREÇO JUSTO</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="dark-mode">

  <header class="header">
    <div class="header-logo">
      <a href="index.html" class="logo-brand">
        <img src="./logo.png" alt="Preço Justo Logo" class="nav-logo-img">
      </a>
    </div>
    <div class="header-nav-actions">
      <a href="login.html" class="header-btn">Já tem conta? Entrar</a>
    </div>
  </header>

  <main class="login-wrapper" style="min-height: 85vh; padding: 2rem 1rem; display: flex; align-items: center; justify-content: center;">
    <div class="login-card" style="max-width: 520px; width: 100%; padding: 2.5rem; border-radius: 20px;">
      <h2 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 0.4rem; text-align: center;">Portal do Parceiro</h2>
      <p style="font-size: 0.85rem; color: #9CA3AF; margin-bottom: 1.5rem; text-align: center;">
        Cadastre sua empresa para expor suas ofertas no PREÇO JUSTO.
      </p>

      <form onsubmit="cadastrarEmpresa(event)">
        
        <div class="login-form-group" style="margin-bottom: 1rem;">
          <label style="font-size: 0.75font; font-weight: 700; color: #9CA3AF; text-transform: uppercase; margin-bottom: 0.3rem; display: block;">Nome da Empresa / Razão Social</label>
          <input type="text" id="empNome" placeholder="Ex: Pousada Vista Linda" required style="width: 100%; background-color: #0E1719; border: 1px solid #374151; padding: 0.8rem 1rem; border-radius: 10px; color: #FFFFFF; font-size: 0.95rem; outline: none;">
        </div>

        <div class="login-form-group" style="margin-bottom: 1rem;">
          <label style="font-size: 0.75rem; font-weight: 700; color: #9CA3AF; text-transform: uppercase; margin-bottom: 0.3rem; display: block;">CNPJ ou CPF do Responsável</label>
          <input type="text" id="empDocumento" placeholder="00.000.000/0001-00" required style="width: 100%; background-color: #0E1719; border: 1px solid #374151; padding: 0.8rem 1rem; border-radius: 10px; color: #FFFFFF; font-size: 0.95rem; outline: none;">
        </div>

        <div class="login-form-group" style="margin-bottom: 1rem;">
          <label style="font-size: 0.75rem; font-weight: 700; color: #9CA3AF; text-transform: uppercase; margin-bottom: 0.3rem; display: block;">E-mail de Contato / Comercial</label>
          <input type="email" id="empEmail" placeholder="contato@suaempresa.com" required style="width: 100%; background-color: #0E1719; border: 1px solid #374151; padding: 0.8rem 1rem; border-radius: 10px; color: #FFFFFF; font-size: 0.95rem; outline: none;">
        </div>

        <div class="login-form-group" style="margin-bottom: 1.2rem;">
          <label style="font-size: 0.75rem; font-weight: 700; color: #9CA3AF; text-transform: uppercase; margin-bottom: 0.3rem; display: block;">Segmento (Ramo de Atuação)</label>
          <select id="empSegmento" onchange="mudarFormularioSegmento()" style="width: 100%; background-color: #0E1719; border: 1px solid #374151; padding: 0.8rem 1rem; border-radius: 10px; color: #FFFFFF; font-size: 0.95rem; outline: none; cursor: pointer;" required>
            <option value="" disabled selected>-- Escolha uma categoria --</option>
            <option value="hospedagem">🏨 Hotel / Pousada / Hospedagem</option>
            <option value="carros">🚗 Loja de Aluguel de Carros</option>
            <option value="voos">✈️ Companhia Aérea / Oferta de Voos</option>
            <option value="seguros">🛡️ Corretora de Seguros Viagem</option>
          </select>
        </div>

        <div id="camposDinamicos" style="margin-top: 1rem; border-top: 1px solid #1F2937; padding-top: 1rem;"></div>

        <button type="submit" style="width: 100%; background-color: #22C55E; color: white; border: none; padding: 0.95rem; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 1rem;">Concluir Cadastro de Empresa</button>
      </form>

      <a href="login.html" style="display: block; text-align: center; margin-top: 1.2rem; color: #9CA3AF; text-decoration: none; font-size: 0.85rem;">← Voltar para a tela de login</a>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-container" style="text-align: center;">
      <p>PREÇO JUSTO © 2026 • Todos os direitos reservados.</p>
    </div>
  </footer>

  <script>
    function mudarFormularioSegmento() {
      const segmento = document.getElementById('empSegmento').value;
      const container = document.getElementById('camposDinamicos');
      let htmlDinamico = '';

      if (segmento === 'hospedagem') {
        htmlDinamico = `
          <h4 style="font-size: 0.85rem; color: #22C55E; margin-bottom: 0.6rem;">Detalhes da Hospedagem</h4>
          <div style="margin-bottom: 0.8rem;">
            <label style="font-size:0.7rem; color:#9CA3AF; font-weight:700;">LOCALIZAÇÃO</label>
            <input type="text" placeholder="Ex: Campos do Jordão, SP" required style="width: 100%; background-color: #0E1719; border: 1px solid #374151; padding: 0.7rem 0.9rem; border-radius: 8px; color: #FFFFFF; font-size: 0.9rem; margin-top: 0.2rem;">
          </div>
          <div style="margin-bottom: 0.5rem;">
            <label style="font-size:0.7rem; color:#9CA3AF; font-weight:700;">VALOR MÉDIO DA DIÁRIA (R$)</label>
            <input type="number" placeholder="Ex: 250" required style="width: 100%; background-color: #0E1719; border: 1px solid #374151; padding: 0.7rem 0.9rem; border-radius: 8px; color: #FFFFFF; font-size: 0.9rem; margin-top: 0.2rem;">
          </div>
        `;
      } else if (segmento === 'carros') {
        htmlDinamico = `
          <h4 style="font-size: 0.85rem; color: #22C55E; margin-bottom: 0.6rem;">Detalhes da Frota</h4>
          <div style="margin-bottom: 0.8rem;">
            <label style="font-size:0.7rem; color:#9CA3AF; font-weight:700;">MODELO DO VEÍCULO</label>
            <input type="text" placeholder="Ex: VW Golf GTI" required style="width: 100%; background-color: #0E1719; border: 1px solid #374151; padding: 0.7rem 0.9rem; border-radius: 8px; color: #FFFFFF; font-size: 0.9rem; margin-top: 0.2rem;">
          </div>
          <div style="margin-bottom: 0.5rem;">
            <label style="font-size:0.7rem; color:#9CA3AF; font-weight:700;">VALOR DA DIÁRIA (R$)</label>
            <input type="number" placeholder="Ex: 150" required style="width: 100%; background-color: #0E1719; border: 1px solid #374151; padding: 0.7rem 0.9rem; border-radius: 8px; color: #FFFFFF; font-size: 0.9rem; margin-top: 0.2rem;">
          </div>
        `;
      } else if (segmento === 'voos') {
        htmlDinamico = `
          <h4 style="font-size: 0.85rem; color: #22C55E; margin-bottom: 0.6rem;">Detalhes de Rotas</h4>
          <div style="margin-bottom: 0.8rem;">
            <label style="font-size:0.7rem; color:#9CA3AF; font-weight:700;">ROTA PRINCIPAL</label>
            <input type="text" placeholder="Ex: GRU ➔ BPS" required style="width: 100%; background-color: #0E1719; border: 1px solid #374151; padding: 0.7rem 0.9rem; border-radius: 8px; color: #FFFFFF; font-size: 0.9rem; margin-top: 0.2rem;">
          </div>
          <div style="margin-bottom: 0.5rem;">
            <label style="font-size:0.7rem; color:#9CA3AF; font-weight:700;">PREÇO BASE (R$)</label>
            <input type="number" placeholder="Ex: 450" required style="width: 100%; background-color: #0E1719; border: 1px solid #374151; padding: 0.7rem 0.9rem; border-radius: 8px; color: #FFFFFF; font-size: 0.9rem; margin-top: 0.2rem;">
          </div>
        `;
      } else if (segmento === 'seguros') {
        htmlDinamico = `
          <h4 style="font-size: 0.85rem; color: #22C55E; margin-bottom: 0.6rem;">Detalhes do Seguro</h4>
          <div style="margin-bottom: 0.8rem;">
            <label style="font-size:0.7rem; color:#9CA3AF; font-weight:700;">TIPO DE PLANO</label>
            <input type="text" placeholder="Ex: Nacional R$ 40.000" required style="width: 100%; background-color: #0E1719; border: 1px solid #374151; padding: 0.7rem 0.9rem; border-radius: 8px; color: #FFFFFF; font-size: 0.9rem; margin-top: 0.2rem;">
          </div>
          <div style="margin-bottom: 0.5rem;">
            <label style="font-size:0.7rem; color:#9CA3AF; font-weight:700;">VALOR POR PASSAGEIRO (R$)</label>
            <input type="number" placeholder="Ex: 35" required style="width: 100%; background-color: #0E1719; border: 1px solid #374151; padding: 0.7rem 0.9rem; border-radius: 8px; color: #FFFFFF; font-size: 0.9rem; margin-top: 0.2rem;">
          </div>
        `;
      }
      container.innerHTML = htmlDinamico;
    }

    function cadastrarEmpresa(event) {
      event.preventDefault();
      alert('Parabéns! Sua empresa foi cadastrada com sucesso e passará pela validação da equipe Preço Justo.');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
