<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Empresa | PREÇO JUSTO</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="dark-mode">

  <header class="header">
    <div class="header-logo">
      <a href="index.html" class="logo-brand">
        <img src="./logo.png" alt="Preço Justo Logo" class="nav-logo-img">
      </a>
    </div>
    <div class="header-nav-actions">
      <a href="login.html" class="header-btn">Já tem conta? Entrar</a>
    </div>
  </header>

  <main class="login-wrapper" style="min-height: 85vh; padding: 2rem 1rem;">
    <div class="login-card" style="max-width: 600px;">
      <h2>Portal do Parceiro • Registrar Empresa</h2>
      <p style="font-size: 0.85rem; color: #9CA3AF; margin-bottom: 1.5rem; text-align: center;">
        Cadastre seu estabelecimento ou serviço para expor suas ofertas na plataforma PREÇO JUSTO.
      </p>

      <form onsubmit="cadastrarEmpresa(event)">
        
        <div class="login-input-group">
          <label>Nome da Empresa / Razão Social</label>
          <input type="text" id="empNome" placeholder="Ex: Locadora Exemplo / Pousada Vista Linda" required>
        </div>

        <div class="login-input-group">
          <label>CNPJ ou CPF do Responsável</label>
          <input type="text" id="empDocumento" placeholder="00.000.000/0001-00" required>
        </div>

        <div class="login-input-group">
          <label>E-mail de Contato / Comercial</label>
          <input type="email" id="empEmail" placeholder="contato@suaempresa.com" required>
        </div>

        <div class="login-input-group">
          <label>Selecione o seu Segmento (Ramo de Atuação)</label>
          <select id="empSegmento" onchange="mudarFormularioSegmento()" style="background-color: #0E1719; border: 1px solid #374151; padding: 0.8rem 1rem; border-radius: 8px; color: #FFFFFF; font-size: 0.95rem; outline: none; cursor: pointer;" required>
            <option value="" disabled selected>-- Escolha uma categoria --</option>
            <option value="hospedagem">🏨 Hotel / Pousada / Hospedagem</option>
            <option value="carros">🚗 Loja de Aluguel de Carros</option>
            <option value="voos">✈️ Companhia Aérea / Oferta de Voos</option>
            <option value="seguros">🛡️ Corretora de Seguros Viagem</option>
          </select>
        </div>

        <div id="camposDinamicos" style="margin-top: 1rem; border-top: 1px solid #1F2937; padding-top: 1rem;"></div>

        <button type="submit" class="btn-login-submit" style="margin-top: 1.5rem;">Concluir Cadastro de Empresa</button>
      </form>

      <a href="login.html" class="back-home">← Voltar para a tela de login</a>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-container" style="text-align: center;">
      <p>PREÇO JUSTO © 2026 • Todos os direitos reservados.</p>
    </div>
  </footer>

  <script>
    function mudarFormularioSegmento() {
      const segmento = document.getElementById('empSegmento').value;
      const container = document.getElementById('camposDinamicos');
      let htmlDinamico = '';

      if (segmento === 'hospedagem') {
        htmlDinamico = `
          <h4 style="font-size: 0.9rem; color: #22C55E; margin-bottom: 0.8rem;">Detalhes da Hospedagem</h4>
          <div class="login-input-group">
            <label>Cidade / Localização</label>
            <input type="text" placeholder="Ex: Natal, RN ou Campos do Jordão, SP" required>
          </div>
          <div class="login-input-group">
            <label>Valor Médio da Diária (R$)</label>
            <input type="number" placeholder="Ex: 250" required>
          </div>
        `;
      } else if (segmento === 'carros') {
        htmlDinamico = `
          <h4 style="font-size: 0.9rem; color: #22C55E; margin-bottom: 0.8rem;">Detalhes da Frota de Carros</h4>
          <div class="login-input-group">
            <label>Modelo do Veículo Principal</label>
            <input type="text" placeholder="Ex: Volkswagen Golf GTI ou Chevrolet Camaro ZL1" required>
          </div>
          <div class="login-input-group">
            <label>Valor da Diária de Locação (R$)</label>
            <input type="number" placeholder="Ex: 150" required>
          </div>
        `;
      } else if (segmento === 'voos') {
        htmlDinamico = `
          <h4 style="font-size: 0.9rem; color: #22C55E; margin-bottom: 0.8rem;">Detalhes de Rotas Aéreas</h4>
          <div class="login-input-group">
            <label>Rota Principal (Origem ➔ Destino)</label>
            <input type="text" placeholder="Ex: GRU ➔ BPS" required>
          </div>
          <div class="login-input-group">
            <label>Preço Base do Bilhete (R$)</label>
            <input type="number" placeholder="Ex: 450" required>
          </div>
        `;
      } else if (segmento === 'seguros') {
        htmlDinamico = `
          <h4 style="font-size: 0.9rem; color: #22C55E; margin-bottom: 0.8rem;">Detalhes da Cobertura de Seguro</h4>
          <div class="login-input-group">
            <label>Tipo de Plano / Cobertura</label>
            <input type="text" placeholder="Ex: Nacional R$ 40.000 ou Europa EUR 30.000" required>
          </div>
          <div class="login-input-group">
            <label>Valor por Passageiro (R$)</label>
            <input type="number" placeholder="Ex: 35" required>
          </div>
        `;
      }
      container.innerHTML = htmlDinamico;
    }

    function cadastrarEmpresa(event) {
      event.preventDefault();
      alert('Parabéns! Sua empresa foi cadastrada com sucesso e passará pela validação da equipe Preço Justo.');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
