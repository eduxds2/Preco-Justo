<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Empresa | PREÇO JUSTO</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="dark-mode">

  <header class="header">
    <div class="header-logo">
      <a href="index.html" class="logo-brand">
        <img src="./logo.png" alt="Preço Justo Logo" class="nav-logo-img">
      </a>
    </div>
    <div class="header-nav-actions">
      <a href="login.html" class="header-btn">Já tem conta? Entrar</a>
    </div>
  </header>

  <main class="login-wrapper" style="min-height: 80vh; padding: 1.5rem 1rem;">
    <!-- Painel com tamanho compacto e refinado -->
    <div class="login-card" style="max-width: 480px; padding: 2rem;">
      <h2 style="font-size: 1.25rem; margin-bottom: 0.4rem;">Portal do Parceiro • Registrar Empresa</h2>
      <p style="font-size: 0.8rem; color: #9CA3AF; margin-bottom: 1.2rem; text-align: center;">
        Cadastre seu estabelecimento ou serviço para expor suas ofertas no PREÇO JUSTO.
      </p>

      <form onsubmit="cadastrarEmpresa(event)">
        
        <div class="login-input-group" style="margin-bottom: 0.9rem;">
          <label>Nome da Empresa / Razão Social</label>
          <input type="text" id="empNome" placeholder="Ex: Pousada Vista Linda" required style="padding: 0.7rem 0.9rem; font-size: 0.9rem;">
        </div>

        <div class="login-input-group" style="margin-bottom: 0.9rem;">
          <label>CNPJ ou CPF do Responsável</label>
          <input type="text" id="empDocumento" placeholder="00.000.000/0001-00" required style="padding: 0.7rem 0.9rem; font-size: 0.9rem;">
        </div>

        <div class="login-input-group" style="margin-bottom: 0.9rem;">
          <label>E-mail de Contato / Comercial</label>
          <input type="email" id="empEmail" placeholder="contato@suaempresa.com" required style="padding: 0.7rem 0.9rem; font-size: 0.9rem;">
        </div>

        <div class="login-input-group" style="margin-bottom: 0.9rem;">
          <label>Segmento (Ramo de Atuação)</label>
          <select id="empSegmento" onchange="mudarFormularioSegmento()" style="background-color: #0E1719; border: 1px solid #374151; padding: 0.7rem 0.9rem; border-radius: 8px; color: #FFFFFF; font-size: 0.9rem; outline: none; cursor: pointer;" required>
            <option value="" disabled selected>-- Escolha uma categoria --</option>
            <option value="hospedagem">🏨 Hotel / Pousada / Hospedagem</option>
            <option value="carros">🚗 Loja de Aluguel de Carros</option>
            <option value="voos">✈️ Companhia Aérea / Oferta de Voos</option>
            <option value="seguros">🛡️ Corretora de Seguros Viagem</option>
          </select>
        </div>

        <div id="camposDinamicos" style="margin-top: 0.8rem; border-top: 1px solid #1F2937; padding-top: 0.8rem;"></div>

        <button type="submit" class="btn-login-submit" style="margin-top: 1.2rem; padding: 0.8rem; font-size: 0.9rem;">Concluir Cadastro de Empresa</button>
      </form>

      <a href="login.html" class="back-home" style="margin-top: 1rem;">← Voltar para a tela de login</a>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-container" style="text-align: center;">
      <p>PREÇO JUSTO © 2026 • Todos os direitos reservados.</p>
    </div>
  </footer>

  <script>
    function mudarFormularioSegmento() {
      const segmento = document.getElementById('empSegmento').value;
      const container = document.getElementById('camposDinamicos');
      let htmlDinamico = '';

      if (segmento === 'hospedagem') {
        htmlDinamico = `
          <h4 style="font-size: 0.85rem; color: #22C55E; margin-bottom: 0.6rem;">Detalhes da Hospedagem</h4>
          <div class="login-input-group" style="margin-bottom: 0.8rem;">
            <label style="font-size:0.7rem;">Cidade / Localização</label>
            <input type="text" placeholder="Ex: Campos do Jordão, SP" required style="padding: 0.6rem 0.8rem; font-size: 0.85rem;">
          </div>
          <div class="login-input-group" style="margin-bottom: 0.5rem;">
            <label style="font-size:0.7rem;">Valor Médio da Diária (R$)</label>
            <input type="number" placeholder="Ex: 250" required style="padding: 0.6rem 0.8rem; font-size: 0.85rem;">
          </div>
        `;
      } else if (segmento === 'carros') {
        htmlDinamico = `
          <h4 style="font-size: 0.85rem; color: #22C55E; margin-bottom: 0.6rem;">Detalhes da Frota</h4>
          <div class="login-input-group" style="margin-bottom: 0.8rem;">
            <label style="font-size:0.7rem;">Modelo do Veículo Principal</label>
            <input type="text" placeholder="Ex: VW Golf GTI" required style="padding: 0.6rem 0.8rem; font-size: 0.85rem;">
          </div>
          <div class="login-input-group" style="margin-bottom: 0.5rem;">
            <label style="font-size:0.7rem;">Valor da Diária (R$)</label>
            <input type="number" placeholder="Ex: 150" required style="padding: 0.6rem 0.8rem; font-size: 0.85rem;">
          </div>
        `;
      } else if (segmento === 'voos') {
        htmlDinamico = `
          <h4 style="font-size: 0.85rem; color: #22C55E; margin-bottom: 0.6rem;">Detalhes de Rotas</h4>
          <div class="login-input-group" style="margin-bottom: 0.8rem;">
            <label style="font-size:0.7rem;">Rota Principal (Origem ➔ Destino)</label>
            <input type="text" placeholder="Ex: GRU ➔ BPS" required style="padding: 0.6rem 0.8rem; font-size: 0.85rem;">
          </div>
          <div class="login-input-group" style="margin-bottom: 0.5rem;">
            <label style="font-size:0.7rem;">Preço Base (R$)</label>
            <input type="number" placeholder="Ex: 450" required style="padding: 0.6rem 0.8rem; font-size: 0.85rem;">
          </div>
        `;
      } else if (segmento === 'seguros') {
        htmlDinamico = `
          <h4 style="font-size: 0.85rem; color: #22C55E; margin-bottom: 0.6rem;">Detalhes do Seguro</h4>
          <div class="login-input-group" style="margin-bottom: 0.8rem;">
            <label style="font-size:0.7rem;">Tipo de Plano / Cobertura</label>
            <input type="text" placeholder="Ex: Nacional R$ 40.000" required style="padding: 0.6rem 0.8rem; font-size: 0.85rem;">
          </div>
          <div class="login-input-group" style="margin-bottom: 0.5rem;">
            <label style="font-size:0.7rem;">Valor por Passageiro (R$)</label>
            <input type="number" placeholder="Ex: 35" required style="padding: 0.6rem 0.8rem; font-size: 0.85rem;">
          </div>
        `;
      }
      container.innerHTML = htmlDinamico;
    }

    function cadastrarEmpresa(event) {
      event.preventDefault();
      alert('Parabéns! Sua empresa foi cadastrada com sucesso e passará pela validação da equipe Preço Justo.');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
